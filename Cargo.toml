[package]
name = "rs-easy-installer-windows"
version = "0.1.0"
edition = "2024"
authors = ["Hastur-Dev"]
description = "An automated installer for Rust with MSVC toolchain on Windows - downloads and installs Visual Studio C++ redistributable"
license = "MIT"
repository = "https://github.com/hastur-dev/rs-easy-installer-windows"
keywords = ["rust", "windows", "msvc", "visual-studio", "installer"]
categories = ["development-tools", "development-tools::build-utils"]

[[bin]]
name = "rs-easy-installer-windows"
path = "src/main.rs"

[dependencies]
